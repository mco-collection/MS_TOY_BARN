name: Backup Mercari migration images
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  backup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/mercari-migration-audit
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Download and verify images
        run: python migration/download-images.py
      - name: Save verified image files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add migration/images migration/waiting-batch-*.json
          if ! git diff --cached --quiet; then
            git commit -m "Back up Mercari images for staged items"
            git push origin HEAD:feature/mercari-migration-audit
          fi
